on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-library:
    runs-on: ubuntu-22.04
    permissions:
      # No `id-token: write` here on purpose — this job only builds and tests.
      # The OIDC token is minted solely for `npm publish --provenance`, which
      # runs in `deploy-library`; granting it to a job that never publishes
      # widens the blast radius of any compromised build step for no benefit.
      contents: read
    concurrency: ci-${{github.ref}}

    steps:
      - name: Checkout to repo in current branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build Library
        run: npm run build

  # Deployment job
  deploy-library:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    needs: build-library
    # A publish must never race another publish: two pushes landing on main in
    # quick succession would otherwise run `npm publish` concurrently, and the
    # loser fails on an already-taken version (or, worse, publishes out of
    # order). Its own group — NOT the build's `ci-<ref>` — so a queued deploy
    # does not block unrelated builds.
    concurrency: deploy-npm-${{github.ref}}
    environment:
      name: npm
    permissions:
      # Required by `npm publish --provenance`: npm exchanges this OIDC token
      # with Sigstore to attest the build.
      id-token: write
      contents: read
    steps:
      - name: Checkout to repo in current branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Library
        run: npm run build

      - name: Deploy to NPM
        run: unset NODE_AUTH_TOKEN && npm publish --provenance --access public
