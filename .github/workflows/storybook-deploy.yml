on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-storybook:
    runs-on: ubuntu-22.04
    concurrency: ci-${{github.ref}}

    steps:
      - name: Checkout to repo in current branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Install Dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  # Deployment job
  deploy-storybook:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build-storybook
    permissions:
      id-token: write
      pages: write
    steps:
      # `id` is load-bearing: the job's `environment.url` above reads
      # `steps.deployment.outputs.page_url`, which silently resolves to an
      # empty string without it — leaving the Environments UI with no link to
      # what was published.
      #
      # No `env: GITHUB_TOKEN` — `deploy-pages@v4` takes a `token` INPUT that
      # already defaults to `github.token`; the env var was inert and implied a
      # dependency this job does not have.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
